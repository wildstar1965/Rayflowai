# RayFlow AI — Google Cloud Build pipeline (Cloud Run Services + Cloud Run Job).
#
# Builds backend, frontend, and render-worker images tagged with the commit SHA,
# pushes them to Artifact Registry, and deploys/updates:
#   - rayflow-backend   (Cloud Run Service)
#   - rayflow-frontend  (Cloud Run Service, proxies /api -> backend)
#   - rayflow-render     (Cloud Run Job)
#
# Secrets are referenced from Secret Manager at deploy time and NEVER baked into
# images or this file. Override any substitution with --substitutions.
#
# Example:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_REPO=rayflow,SHORT_SHA=$(git rev-parse --short HEAD)

substitutions:
  _REGION: asia-south1
  _REPO: rayflow
  _BACKEND_SERVICE: rayflow-backend
  _FRONTEND_SERVICE: rayflow-frontend
  _RENDER_JOB: rayflow-render
  _GCS_BUCKET: rayflow-storage-ladysingham
  # Comma-separated Secret Manager bindings applied to the backend + job.
  # Each entry maps an ENV var to a secret name:version. Persistence uses GCS
  # (GCS_BUCKET), so no database secret is required.
  _BACKEND_SECRETS: >-
    QLOO_API_KEY=QLOO_API_KEY:latest,RAYFLOW_VAULT_SECRET=RAYFLOW_VAULT_SECRET:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/render-worker:$SHORT_SHA'

steps:
  # 1. Build backend image.
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA'
      - .

  # 2. Build render-worker image.
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile.worker
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/render-worker:$SHORT_SHA'
      - .

  # 3. Build frontend image (Cloud Run variant).
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile.cloudrun
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA'
      - .

  # 4. Push all images.
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA']
    waitFor: ['build-backend']
  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/render-worker:$SHORT_SHA']
    waitFor: ['build-worker']
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA']
    waitFor: ['build-frontend']

  # 5. Deploy backend Cloud Run Service.
  - id: deploy-backend
    name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_BACKEND_SERVICE}'
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8000
      - --cpu=2
      - --memory=2Gi
      - --concurrency=20
      - --timeout=900
      - --min-instances=0
      - --max-instances=4
      - --set-env-vars=RAYFLOW_ENV=production,RAYFLOW_STORAGE_DIR=/tmp/rayflow,GCS_BUCKET=${_GCS_BUCKET},GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},RENDER_CLOUD_RUN_JOB=${_RENDER_JOB}
      - --set-secrets=${_BACKEND_SECRETS}
    waitFor: ['push-backend']

  # 6. Create/update the render Cloud Run Job.
  - id: deploy-render-job
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # $$ escapes a literal $ so Cloud Build does not treat these as substitutions.
        COMMON="--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/render-worker:$SHORT_SHA \
          --region=${_REGION} --tasks=1 --max-retries=1 --task-timeout=2000 \
          --cpu=2 --memory=4Gi \
          --set-env-vars=RAYFLOW_ENV=production,RAYFLOW_STORAGE_DIR=/tmp/rayflow,GCS_BUCKET=${_GCS_BUCKET},GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION} \
          --set-secrets=${_BACKEND_SECRETS}"
        if gcloud run jobs describe ${_RENDER_JOB} --region=${_REGION} >/dev/null 2>&1; then
          gcloud run jobs update ${_RENDER_JOB} $$COMMON
        else
          gcloud run jobs create ${_RENDER_JOB} $$COMMON
        fi
    waitFor: ['push-worker']

  # 7. Deploy frontend Cloud Run Service (public), proxying /api to the backend.
  - id: deploy-frontend
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # $$ escapes literal $ so Cloud Build does not treat these as substitutions.
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        BACKEND_HOST=$$(echo "$$BACKEND_URL" | sed -E 's#^https?://##')
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA \
          --region=${_REGION} --platform=managed --allow-unauthenticated \
          --port=8080 --cpu=1 --memory=512Mi --concurrency=80 \
          --min-instances=0 --max-instances=4 \
          --set-env-vars=BACKEND_URL=$$BACKEND_URL,BACKEND_HOST=$$BACKEND_HOST
    waitFor: ['deploy-backend', 'push-frontend']
